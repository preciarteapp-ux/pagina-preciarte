<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>passo-01-material-conversao</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Reproduz o MaterialFormModal em viewport de 390px.
     Nessa largura o campo "Unidade Antiga (Compatibilidade)" nao aparece
     (classe hidden sm:block no componente real) e os tres campos de unidade
     ficam empilhados (grid-cols-1 sm:grid-cols-3). O recorte abaixo e
     contiguo: e exatamente o que um print real do celular produziria. */
  body { width: 390px; }
</style>
</head>
<body>


  <div class="field">
    <label class="label">Nome do Material</label>
    <div class="input">Papel A4 250g</div>
  </div>

  <!-- inicio do recorte -->
<div class="shot shot-tall"><div id="crop-start"></div>

  <div class="field">
    <label class="label">Como você compra?</label>
    <div class="select">
      <span>Resma (pacote)</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
  </div>

  <div class="field">
    <label class="label">Como você usa?</label>
    <div class="select">
      <span>Folha</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
  </div>

  <div class="field">
    <label class="label">Quantas unidades vêm?</label>
    <div class="input">500</div>
  </div>

  <div class="box-blue">
    <strong>💡 Exemplo:</strong> Papel A4 - Você compra 1 <strong>resma</strong> que tem <strong>500 folhas</strong>
    <br>• Como você compra: "Resma"
    <br>• Como você usa: "Folha"
    <br>• Quantas unidades vêm: 500
  </div>

  <div class="field">
    <label class="label">Preço de Compra (R$)</label>
    <div class="input">68,00</div>
  </div>

  <div class="box-green">
    Preço por folha: <span class="val">R$ 0,14</span>
  </div>

  <!-- fim do recorte -->
  <div id="crop-end"></div></div>

</body>
</html>
