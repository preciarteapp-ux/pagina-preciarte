<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>passo-01-material-conversao</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Tela Materiais com o cadastro aberto, viewport de 390px.
     Nessa largura o app empilha os tres campos de unidade
     (grid-cols-1 sm:grid-cols-3) e esconde "Unidade Antiga"
     (hidden sm:block). Conteudo identico ao MaterialFormModal. */
  body { width: 390px; background: #FDF2F6; }
  .field { margin-top: 14px; }
</style>
</head>
<body>

<div class="stage shot-tall">
  <div id="crop-start"></div>

  <div class="appbar">Materiais<span class="dot"></span></div>

  <div class="ui-card">
    <div class="ui-card-head">
      <span class="ui-card-title">Novo Material</span>
      <span class="ui-card-tag">Papel A4 250g</span>
    </div>

    <div class="field">
      <label class="label">Como você compra?</label>
      <div class="select">
        <span>Resma (pacote)</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

    <div class="field">
      <label class="label">Como você usa?</label>
      <div class="select">
        <span>Folha</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

    <div class="field">
      <label class="label">Quantas unidades vêm?</label>
      <div class="input">500</div>
    </div>

    <div class="field">
      <label class="label">Preço de Compra (R$)</label>
      <div class="input">68,00</div>
    </div>

    <div class="box-green">
      Preço por folha: <span class="val">R$ 0,14</span>
    </div>
  </div>

  <div id="crop-end"></div>
</div>

</body>
</html>
