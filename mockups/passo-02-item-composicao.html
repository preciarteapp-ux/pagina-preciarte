<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>passo-02-item-composicao</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Itens de Venda com o item aberto: a composicao de custo do
     ItemVendaFormModal. Numeros iguais aos das outras telas. */
  body { width: 390px; background: #FDF2F6; }
  .row-cost { display:flex; align-items:center; justify-content:space-between; padding:11px 0; }
  .row-cost + .row-cost { border-top: 1px solid var(--border); }
  .row-cost .k { font-size:14px; color:var(--muted-fg); }
  .row-cost .k b { display:block; color:var(--fg); font-weight:600; font-size:15px; }
  .row-cost .v { font-size:16px; font-weight:600; color:var(--primary); }
  .total { margin-top:14px; padding:14px; border-radius:12px; background:rgb(212 106 146 / .10); border:1px solid rgb(212 106 146 / .20); display:flex; justify-content:space-between; align-items:center; }
  .total .k { font-family:'Poppins',sans-serif; font-weight:600; font-size:15px; }
  .total .v { font-family:'Poppins',sans-serif; font-weight:700; font-size:22px; color:var(--primary); }
</style>
</head>
<body>

<div class="stage shot-tall">
  <div id="crop-start"></div>

  <div class="appbar">Itens de Venda<span class="dot"></span></div>

  <div class="ui-card">
    <div class="ui-card-head">
      <span class="ui-card-title">Custos do item</span>
      <span class="ui-card-tag">Convite Premium</span>
    </div>

    <div style="margin-top:6px">
      <div class="row-cost">
        <span class="k"><b>Impressão</b>2x R$ 0,42</span>
        <span class="v">R$ 0,84</span>
      </div>
      <div class="row-cost">
        <span class="k"><b>Materiais</b>3 itens selecionados</span>
        <span class="v">R$ 2,18</span>
      </div>
      <div class="row-cost">
        <span class="k"><b>Mão de obra</b>12min × R$ 32,10/h</span>
        <span class="v">R$ 6,42</span>
      </div>
      <div class="row-cost">
        <span class="k"><b>Outras taxas</b>embalagem, frete</span>
        <span class="v">R$ 0,00</span>
      </div>
    </div>

    <div class="total">
      <span class="k">Custo Total</span>
      <span class="v">R$ 9,44</span>
    </div>

    <p class="xs muted" style="margin-top:10px">Usando valor real da hora (inclui custos fixos)</p>
  </div>

  <div id="crop-end"></div>
</div>

</body>
</html>
