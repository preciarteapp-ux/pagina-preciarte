<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>passo-03-margem-colorida</title>
<link rel="stylesheet" href="base.css">
<style>
  /* O momento da margem colorida: getMarginColor() devolve destructive
     abaixo de 40%. Aqui 27,1%, com Meu Preco 12,00 sobre custo 9,44. */
  body { width: 390px; background: #FDF2F6; }
  .margem { margin-top:4px; padding:16px; border-radius:12px; background:rgb(239 68 68 / .08); border:1px solid rgb(239 68 68 / .22); text-align:center; }
  .margem .lbl { font-size:13px; color:var(--muted-fg); }
  .margem .num { font-family:'Poppins',sans-serif; font-weight:700; font-size:40px; color:var(--destructive); line-height:1.1; margin-top:2px; }
  .margem .sub { font-size:13px; color:var(--muted-fg); margin-top:2px; }
  .price { display:flex; justify-content:space-between; align-items:center; padding:12px 0; }
  .price + .price { border-top:1px solid var(--border); }
  .price .k { font-size:14px; color:var(--muted-fg); }
  .price .v { font-family:'Poppins',sans-serif; font-weight:600; font-size:19px; }
  .escala { display:flex; gap:6px; margin-top:14px; }
  .escala span { flex:1; height:6px; border-radius:999px; background:var(--border); }
  .escala .on { background:var(--destructive); }
</style>
</head>
<body>

<div class="stage shot-tall">
  <div id="crop-start"></div>

  <div class="appbar">Itens de Venda<span class="dot"></span></div>

  <div class="ui-card">
    <div class="ui-card-head">
      <span class="ui-card-title">Margem do item</span>
      <span class="ui-card-tag">Convite Premium</span>
    </div>

    <div class="margem">
      <div class="lbl">Margem Atual</div>
      <div class="num">27,1%</div>
      <div class="sub">Lucro: R$ 2,56</div>
      <div class="escala"><span class="on"></span><span></span><span></span></div>
    </div>

    <div style="margin-top:12px">
      <div class="price">
        <span class="k">Custo Total</span>
        <span class="v">R$ 9,44</span>
      </div>
      <div class="price">
        <span class="k">Preço Sugerido</span>
        <span class="v" style="color:var(--primary)">R$ 14,16</span>
      </div>
      <div class="price">
        <span class="k">Meu Preço</span>
        <span class="v">R$ 12,00</span>
      </div>
    </div>
  </div>

  <div id="crop-end"></div>
</div>

</body>
</html>
